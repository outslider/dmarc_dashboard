# config.ini にコピーして編集してください。
#   cp config.example.ini config.ini

[imap]
# rua (DMARC 集計レポート) の宛先メールボックス。空欄なら IMAP 取得は無効。
# さくらインターネット (レンタルサーバ / メールボックス) の場合:
#   host = 初期ドメイン (例: アカウント名.sakura.ne.jp)。独自ドメイン名を指定すると証明書エラーになります
#   user = メールアドレス全体
host =
port = 993
ssl = true
user = dmarc@example.co.jp
# パスワードは環境変数 DMARC_IMAP_PASSWORD でも指定できます (こちらが優先)
password =
folder = INBOX
# 取り込み対象の IMAP 検索条件 (UNSEEN = 未読のみ / ALL = すべて。重複は自動で除外)
search = UNSEEN
# 取り込み済みメールの移動先フォルダ (空欄なら既読にするだけ。事前にウェブメール等で作成しておくこと)
# 正確なフォルダ名は `python3 -m dmarc_dashboard folders` で確認できます。英数字の名前を推奨
processed_folder =

[server]
# Apache の背後に置く場合は 127.0.0.1 のままにしてください (deploy/apache-dmarc_dashboard.conf)
host = 127.0.0.1
port = 8080
# Apache 等のサブディレクトリ配下で公開する場合のパス (例: /dmarc_dashboard)。直接アクセスなら空欄
base_path =
# アプリ側の Basic 認証 (空欄なら認証なし。Apache 側で認証する場合は空欄に)
user =
password =

[database]
path = data/dmarc.sqlite3

[dns]
# 送信元 IP を逆引きしてホスト名・送信サービスを表示する
resolve = true
