# Apache リバースプロキシ設定例
#   https://<サーバー>/dmarc_dashboard/ でダッシュボードを公開する
#
# 配置先の例:
#   RHEL / Rocky / Amazon Linux : /etc/httpd/conf.d/dmarc_dashboard.conf
#   Debian / Ubuntu             : /etc/apache2/conf-available/dmarc_dashboard.conf
#                                 (a2enmod proxy proxy_http && a2enconf dmarc_dashboard)
# 既存の HTTPS (443) の VirtualHost の中に書くか、この Include で読み込んでください。
#
# config.ini 側は次のように合わせます:
#   [server]
#   host = 127.0.0.1
#   port = 8080
#   base_path = /dmarc_dashboard

# パスはそのまま (プレフィックスを残して) 転送する。
# /dmarc_dashboard (末尾スラッシュなし) はアプリ側で /dmarc_dashboard/ へリダイレクトされる。
# timeout は「メールを取得」ボタン (IMAP 取得) が長引いた場合に備えて長めにする。
ProxyPass        /dmarc_dashboard http://127.0.0.1:8080/dmarc_dashboard timeout=300
ProxyPassReverse /dmarc_dashboard http://127.0.0.1:8080/dmarc_dashboard

<Location /dmarc_dashboard>
    # ---- アクセス制限 (どちらか、または両方) ----
    # (1) Apache の Basic 認証。ユーザー作成:
    #       htpasswd -c /etc/httpd/.htpasswd-dmarc admin
    #     この場合 config.ini の [server] user/password は空欄にしてください。
    AuthType Basic
    AuthName "DMARC Dashboard"
    AuthUserFile /etc/httpd/.htpasswd-dmarc
    Require valid-user

    # (2) 社内ネットワークからのみ許可する場合 (上の Require valid-user と置き換え)
    # Require ip 192.168.0.0/16 10.0.0.0/8

    # ファイル取り込みのアップロード上限 (アプリ側の上限は 30MB)
    LimitRequestBody 31457280
</Location>
